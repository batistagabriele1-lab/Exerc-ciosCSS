<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Coffee</title>
    
    <!-- Fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: #333333;
        }

        .banner {
            background-image: url('C:\Users\2ºANO\Documents\GitHub\Exerc-ciosCSS\sprint3\img\banner3.png'); /* substitua pelo caminho do seu banner */
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 120px 20px;
            color: #5C4033;
            position: relative;
        }

        .banner h1 {
            font-size: 60px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* melhora a leitura sobre a imagem */
        }

        .banner p {
            font-size: 24px;
            margin-bottom: 40px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .botao-banner {
            background-color: #D9A15B; /* cor caramelo do botão */
            color: #ffffff;
            padding: 15px 35px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }

        .botao-banner:hover {
            filter: brightness(0.9);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .banner h1 {
                font-size: 40px;
            }
            .banner p {
                font-size: 18px;
            }
            .botao-banner {
                padding: 12px 25px;
            }
        }

        @media (max-width: 480px) {
            .banner h1 {
                font-size: 30px;
            }
            .banner p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="banner">
        <h1>SOUTH COFFE</h1>
        <p>Uma experiência única em cada xícara</p>
        <a href="C:\Users\2ºANO\Documents\GitHub\Exerc-ciosCSS\sprint3\testecalculadora.html" class="botao-banner">Saiba mais</a>
    </div>

</body>
</html>
